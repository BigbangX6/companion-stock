<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot bougies animé</title>
<style>
  :root {
    --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --muted: #64748B; --border: #E2E8F0;
    /* couleurs du robot */
    --head: #0F172A; --mouth: #FFFFFF; --up: #10B981; --down: #F43F5E; --status: #10B981;
  }
  body.dark {
    --bg: #0B1220; --card: #111827; --text: #F8FAFC; --muted: #94A3B8; --border: #1F2937;
    --head: #F1F5F9; --mouth: #0F172A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; transition: background .3s; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 32px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }

  /* ---------- En-tête de démonstration ---------- */
  .header { display: flex; align-items: center; gap: 14px; }
  .brand-name { font-size: 28px; font-weight: 700; letter-spacing: -.5px; line-height: 1; }
  .brand-name span { color: var(--up); font-weight: 300; }
  .tagline { font-size: 13px; font-weight: 300; letter-spacing: 1.2px; color: var(--muted); margin-top: 6px; }

  .sizes { display: flex; align-items: end; gap: 28px; flex-wrap: wrap; }
  .sizes figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; font-size: 14px; }
  .controls button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
                     background: var(--bg); color: var(--text); cursor: pointer; }
  .controls button:hover { border-color: var(--up); }
  .controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .status-btns button.on { border-color: var(--up); font-weight: 600; }

  /* ---------- Le robot ---------- */
  .robot { display: block; overflow: visible; }
  .robot .head   { fill: var(--head); }
  .robot .stroke { stroke: var(--head); }
  .robot .mouth  { stroke: var(--mouth); opacity: .65; }
  .robot .up     { fill: var(--up);   stroke: var(--up); }
  .robot .down   { fill: var(--down); stroke: var(--down); }
  .robot .dot, .robot .ring { fill: var(--status); }

  /* Chaque animation agit sur un groupe différent, pour qu'elles se combinent */
  .robot .gaze, .robot .eye, .robot .ring { transform-box: fill-box; transform-origin: center; }

  /* 1. Regard : glisse très légèrement à gauche puis à droite */
  .robot .gaze { animation: gaze 9s ease-in-out infinite; }
  @keyframes gaze {
    0%, 18%   { transform: translateX(0); }
    24%, 42%  { transform: translateX(-1.6px); }
    48%, 62%  { transform: translateX(0); }
    68%, 86%  { transform: translateX(1.6px); }
    92%, 100% { transform: translateX(0); }
  }

  /* 2. Clignement : déclenché par JS à intervalle aléatoire (classe .blink) */
  .robot.blink .eye { animation: blink .18s ease-in-out; }
  @keyframes blink { 50% { transform: scaleY(.1); } }

  /* 3. Antenne : pulsation = moteur en ligne (vert), en retard (orange), hors ligne (rouge, fixe) */
  .robot .ring { opacity: 0; animation: pulse 2s ease-out infinite; }
  .status-offline .robot .ring { animation: none; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
  body.status-late    { --status: #F59E0B; }
  body.status-offline { --status: #F43F5E; }

  @media (prefers-reduced-motion: reduce) {
    .robot *, .robot.blink .eye { animation: none !important; }
  }
</style>
</head>
<body>

<!-- Modèle du robot, cloné dans chaque emplacement .slot -->
<template id="robot-tpl">
  <svg class="robot" viewBox="0 0 64 64" role="img" aria-label="Companion Stock — robot IA">
    <!-- antenne -->
    <line class="stroke" x1="32" y1="8" x2="32" y2="16" stroke-width="3" stroke-linecap="round"/>
    <circle class="ring" cx="32" cy="6" r="4"/>
    <circle class="dot"  cx="32" cy="6" r="4"/>
    <!-- oreilles + tête -->
    <rect class="head" x="4"  y="30" width="5" height="12" rx="2.5"/>
    <rect class="head" x="55" y="30" width="5" height="12" rx="2.5"/>
    <rect class="head" x="9"  y="16" width="46" height="40" rx="13"/>
    <!-- yeux bougies -->
    <g class="gaze">
      <g class="eye down">
        <line x1="23" y1="25" x2="23" y2="41" stroke-width="2" stroke-linecap="round"/>
        <rect x="19.5" y="29" width="7" height="8" rx="1.5"/>
      </g>
      <g class="eye up">
        <line x1="41" y1="22" x2="41" y2="39" stroke-width="2" stroke-linecap="round"/>
        <rect x="37.5" y="25" width="7" height="10" rx="1.5"/>
      </g>
    </g>
    <!-- sourire -->
    <path class="mouth" d="M27 46.5 Q32 50.5 37 46.5" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
</template>

<main>
  <h2>En-tête du site</h2>
  <div class="card header">
    <div class="slot" data-size="64"></div>
    <div>
      <div class="brand-name">Companion<span> Stock</span></div>
      <div class="tagline">Suivez les trades de l’IA</div>
    </div>
  </div>

  <h2>Tailles</h2>
  <div class="card sizes">
    <figure><div class="slot" data-size="160"></div>160 px</figure>
    <figure><div class="slot" data-size="96"></div>96 px</figure>
    <figure><div class="slot" data-size="48"></div>48 px</figure>
    <figure><div class="slot" data-size="32"></div>32 px</figure>
    <figure><div class="slot" data-size="20"></div>20 px</figure>
  </div>

  <h2>Essais</h2>
  <div class="card controls">
    <button id="blink-now">Cligner maintenant</button>
    <label><input type="checkbox" id="dark"> Fond sombre</label>
    <span class="status-btns">
      Moteur :
      <button data-status="" class="on">🟢 en ligne</button>
      <button data-status="late">🟠 en retard</button>
      <button data-status="offline">🔴 hors ligne</button>
    </span>
  </div>
</main>

<script>
  // 1. Place un robot dans chaque emplacement
  const tpl = document.getElementById('robot-tpl');
  document.querySelectorAll('.slot').forEach(slot => {
    const svg = tpl.content.firstElementChild.cloneNode(true);
    svg.setAttribute('width', slot.dataset.size);
    svg.setAttribute('height', slot.dataset.size);
    slot.appendChild(svg);
  });
  const robots = [...document.querySelectorAll('.robot')];

  // 2. Clignement à intervalle aléatoire (parfois double), comme un vrai regard
  function blink() {
    robots.forEach(r => { r.classList.remove('blink'); void r.getBBox(); r.classList.add('blink'); });
    setTimeout(() => robots.forEach(r => r.classList.remove('blink')), 200);
  }
  (function loop() {
    setTimeout(() => {
      blink();
      if (Math.random() < 0.25) setTimeout(blink, 280);
      loop();
    }, 2500 + Math.random() * 4000);
  })();
  document.getElementById('blink-now').onclick = blink;

  document.getElementById('dark').onchange = e => document.body.classList.toggle('dark', e.target.checked);

  // 3. État du moteur → couleur de l'antenne
  document.querySelectorAll('[data-status]').forEach(btn => btn.onclick = () => {
    document.body.classList.remove('status-late', 'status-offline');
    if (btn.dataset.status) document.body.classList.add('status-' + btn.dataset.status);
    document.querySelectorAll('[data-status]').forEach(b => b.classList.toggle('on', b === btn));
  });

</script>
</body>
</html>
