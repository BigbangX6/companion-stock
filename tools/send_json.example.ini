# Copier ce fichier en send_json.ini (même dossier) et le remplir.
# send_json.ini contient le mot de passe : ne jamais le mettre sur GitHub.

[sftp]
# Serveur SFTP de l'hébergement (OVH : espace client > Hébergements > FTP-SSH)
host = ssh.cluster0XX.hosting.ovh.net
port = 22
user = monlogin
# Mot de passe : ici, ou mieux dans la variable d'environnement COMPANION_SFTP_PASSWORD
password =
# Ou une clé SSH à la place du mot de passe :
# key_file = C:\Users\moi\.ssh\id_ed25519
# Dossier du site sur le serveur (là où se trouve index.html)
remote_dir = www
timeout = 20
